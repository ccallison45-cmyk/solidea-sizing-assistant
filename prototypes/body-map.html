<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solidea Sizing - Body Map</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .body-map-container {
      background: var(--white);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .body-map-layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }

    .body-svg-area {
      flex-shrink: 0;
      width: 200px;
      position: relative;
    }

    .body-svg-area svg {
      width: 100%;
      height: auto;
    }

    .marker-list {
      flex: 1;
    }

    .marker-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--white);
    }

    .marker-item:hover {
      border-color: var(--gold);
      background: #fdf8f0;
    }

    .marker-item.active {
      border-color: var(--gold);
      background: #fdf8f0;
    }

    .marker-item.filled {
      border-color: var(--green);
      background: #f1f8f1;
    }

    .marker-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      border: 3px solid #ccc;
      color: #ccc;
      background: var(--white);
      transition: all 0.2s;
    }

    .marker-item.filled .marker-dot {
      border-color: var(--green);
      background: var(--green);
      color: var(--white);
    }

    .marker-item.active .marker-dot {
      border-color: var(--gold);
      color: var(--gold);
    }

    .marker-info {
      flex: 1;
      min-width: 0;
    }

    .marker-name {
      font-size: var(--font-label);
      font-weight: 600;
      color: var(--navy);
    }

    .marker-value {
      font-size: var(--font-help);
      color: var(--green);
      font-weight: 600;
    }

    /* Input panel */
    .input-panel {
      background: #fdf8f0;
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .input-panel h3 {
      font-size: var(--font-label);
      color: var(--navy);
      margin-bottom: 8px;
    }

    .input-panel .field-help {
      margin-bottom: 12px;
    }

    .input-panel-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .input-panel-actions .btn {
      height: 44px;
      font-size: var(--font-help);
    }

    /* SVG markers */
    .svg-marker {
      cursor: pointer;
      transition: all 0.2s;
    }

    .svg-marker circle {
      transition: all 0.2s;
    }

    .svg-marker.filled circle {
      fill: var(--green);
      stroke: var(--green);
    }

    .svg-marker.active circle {
      fill: var(--gold);
      stroke: var(--gold);
    }

    .svg-marker text {
      font-size: 11px;
      font-weight: 700;
      fill: white;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    @media (max-width: 540px) {
      .body-map-layout {
        flex-direction: column;
      }
      .body-svg-area {
        width: 160px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Find Your Size</h1>
    <div class="subtitle">Version C: Body Map</div>
  </div>

  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to all versions</a>

    <div class="product-selector">
      <label for="product-select">What product are you shopping for?</label>
      <select id="product-select"></select>
    </div>

    <!-- Unit preference -->
    <div class="field-group">
      <span class="field-label">I prefer to measure in:</span>
      <div class="unit-toggle" style="margin-top: 8px; display: inline-flex;">
        <button type="button" class="unit-btn active" data-system="metric">cm / kg</button>
        <button type="button" class="unit-btn" data-system="imperial">in / lbs</button>
      </div>
    </div>

    <div class="tip-banner">
      Tap a numbered circle on the body or in the list to enter that measurement.
      Green circles mean you've entered a value. Fill them all to get your size.
    </div>

    <div id="map-area"></div>
    <div id="input-panel-area"></div>

    <div id="submit-section" class="hidden" style="margin-top:16px;">
      <button type="button" id="submit-btn" class="btn btn-primary" disabled>
        Get My Size
      </button>
    </div>

    <div id="result-section"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    (function () {
      var select = document.getElementById('product-select');
      var mapArea = document.getElementById('map-area');
      var inputPanelArea = document.getElementById('input-panel-area');
      var submitSection = document.getElementById('submit-section');
      var submitBtn = document.getElementById('submit-btn');
      var resultSection = document.getElementById('result-section');

      var currentProduct = '';
      var fieldData = {};
      var fieldNames = [];
      var values = {};   // fieldName -> raw value (in user's unit system)
      var useImperial = false;
      var activeField = null;

      // Body marker positions (Y coordinates on the SVG, relative to body outline)
      // These map common field name keywords to approximate body positions
      var MARKER_POSITIONS = {
        height: { x: 140, y: 30 },
        weight: { x: 160, y: 60 },
        bust: { x: 100, y: 115 },
        underbust: { x: 100, y: 135 },
        waist: { x: 100, y: 160 },
        hip: { x: 100, y: 195 },
        upper_arm: { x: 45, y: 130 },
        forearm: { x: 35, y: 170 },
        wrist: { x: 30, y: 200 },
        palm: { x: 25, y: 225 },
        hand: { x: 25, y: 225 },
        thigh: { x: 85, y: 240 },
        calf: { x: 90, y: 310 },
        ankle: { x: 90, y: 365 },
        leg_length: { x: 130, y: 290 }
      };

      SizingAPI.populateProductSelect(select, SizingAPI.getProductFromURL());

      // Unit toggle
      document.querySelectorAll('.unit-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.unit-btn').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          useImperial = btn.getAttribute('data-system') === 'imperial';
          // Re-render to update unit labels
          if (fieldNames.length > 0) renderMap();
        });
      });

      function getMarkerPos(fieldName) {
        for (var key in MARKER_POSITIONS) {
          if (fieldName.toLowerCase().indexOf(key) !== -1) {
            return MARKER_POSITIONS[key];
          }
        }
        return { x: 100, y: 160 }; // default to waist area
      }

      function buildBodySVG() {
        // Simple body silhouette
        var svg = '<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">';

        // Body outline — simplified, dignified silhouette
        svg += '<g fill="none" stroke="#ccc" stroke-width="1.5">';
        // Head
        svg += '<ellipse cx="100" cy="35" rx="18" ry="22"/>';
        // Neck
        svg += '<line x1="92" y1="57" x2="92" y2="72"/>';
        svg += '<line x1="108" y1="57" x2="108" y2="72"/>';
        // Shoulders & torso
        svg += '<path d="M92,72 L60,85 L50,120 L55,170 L60,195 L65,210 L80,215 L85,260" />';
        svg += '<path d="M108,72 L140,85 L150,120 L145,170 L140,195 L135,210 L120,215 L115,260" />';
        // Left arm
        svg += '<path d="M60,85 L45,120 L38,160 L32,195 L28,215" />';
        svg += '<path d="M55,90 L42,125 L35,165 L30,198 L26,218" />';
        // Right arm
        svg += '<path d="M140,85 L155,120 L162,160 L168,195 L172,215" />';
        svg += '<path d="M145,90 L158,125 L165,165 L170,198 L174,218" />';
        // Left leg
        svg += '<path d="M85,260 L82,310 L80,350 L78,380 L75,390" />';
        svg += '<path d="M100,255 L95,310 L93,350 L91,380 L88,390" />';
        // Right leg
        svg += '<path d="M115,260 L118,310 L120,350 L122,380 L125,390" />';
        svg += '<path d="M100,255 L105,310 L107,350 L109,380 L112,390" />';
        svg += '</g>';

        // Markers for each field
        fieldNames.forEach(function (fieldName, i) {
          var pos = getMarkerPos(fieldName);
          var isFilled = values[fieldName] !== undefined;
          var isActive = activeField === fieldName;
          var cls = 'svg-marker' + (isFilled ? ' filled' : '') + (isActive ? ' active' : '');

          svg += '<g class="' + cls + '" data-field="' + fieldName + '">';
          svg += '<circle cx="' + pos.x + '" cy="' + pos.y + '" r="14" ' +
            'fill="' + (isFilled ? '#2e7d32' : isActive ? '#c9a96e' : '#888') + '" ' +
            'stroke="' + (isFilled ? '#2e7d32' : isActive ? '#c9a96e' : '#888') + '" stroke-width="2"/>';
          svg += '<text x="' + pos.x + '" y="' + pos.y + '">' +
            (isFilled ? '\u2713' : (i + 1)) + '</text>';
          svg += '</g>';
        });

        svg += '</svg>';
        return svg;
      }

      function renderMap() {
        var html = '<div class="body-map-container"><div class="body-map-layout">';

        // SVG area
        html += '<div class="body-svg-area" id="svg-area">' + buildBodySVG() + '</div>';

        // Marker list
        html += '<div class="marker-list">';
        fieldNames.forEach(function (fieldName, i) {
          var f = fieldData[fieldName];
          var isFilled = values[fieldName] !== undefined;
          var isActive = activeField === fieldName;
          var unit = SizingAPI.getDisplayUnit(f.unit, useImperial);
          var cls = 'marker-item' + (isFilled ? ' filled' : '') + (isActive ? ' active' : '');

          html += '<div class="' + cls + '" data-field="' + fieldName + '">';
          html += '<div class="marker-dot">' + (isFilled ? '\u2713' : (i + 1)) + '</div>';
          html += '<div class="marker-info">';
          html += '<div class="marker-name">' + f.label + '</div>';
          if (isFilled) {
            html += '<div class="marker-value">' + values[fieldName] + ' ' + unit + '</div>';
          }
          html += '</div>';
          html += '</div>';
        });
        html += '</div>';

        html += '</div></div>';
        mapArea.innerHTML = html;

        // Attach click handlers
        document.querySelectorAll('.marker-item, .svg-marker').forEach(function (el) {
          el.addEventListener('click', function () {
            var field = el.getAttribute('data-field');
            openInputPanel(field);
          });
        });

        checkAllFilled();
      }

      function openInputPanel(fieldName) {
        activeField = fieldName;
        renderMap(); // re-render to highlight active

        var f = fieldData[fieldName];
        var unit = SizingAPI.getDisplayUnit(f.unit, useImperial);
        var helpText = SizingAPI.getFieldHelp(fieldName);
        var existingValue = values[fieldName] !== undefined ? values[fieldName] : '';

        inputPanelArea.innerHTML =
          '<div class="input-panel">' +
          '<h3>' + f.label + '</h3>' +
          '<span class="field-help">' + helpText + '</span>' +
          '<div class="field-input-row">' +
          '<input type="number" class="field-input" id="map-input" ' +
          'value="' + existingValue + '" placeholder="Enter value" min="0" step="0.1" autofocus>' +
          '<span style="font-size:18px;color:var(--gray-mid);font-weight:600;min-width:30px;">' + unit + '</span>' +
          '</div>' +
          '<div class="input-panel-actions">' +
          '<button type="button" class="btn btn-secondary" id="panel-cancel" style="flex:1;">Cancel</button>' +
          '<button type="button" class="btn btn-primary" id="panel-save" style="flex:2;">Save</button>' +
          '</div>' +
          '</div>';

        var input = document.getElementById('map-input');
        var saveBtn = document.getElementById('panel-save');
        var cancelBtn = document.getElementById('panel-cancel');

        setTimeout(function () { input.focus(); }, 100);

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            savePanelValue();
          }
        });

        saveBtn.addEventListener('click', savePanelValue);

        cancelBtn.addEventListener('click', function () {
          activeField = null;
          inputPanelArea.innerHTML = '';
          renderMap();
        });

        function savePanelValue() {
          var val = parseFloat(input.value);
          if (isNaN(val) || val <= 0) {
            input.classList.add('error');
            return;
          }
          values[fieldName] = val;
          activeField = null;
          inputPanelArea.innerHTML = '';
          renderMap();

          // Auto-open next empty field
          var nextEmpty = fieldNames.find(function (fn) {
            return values[fn] === undefined;
          });
          if (nextEmpty) {
            openInputPanel(nextEmpty);
          }
        }
      }

      function checkAllFilled() {
        var allFilled = fieldNames.every(function (fn) {
          return values[fn] !== undefined;
        });

        if (fieldNames.length > 0) {
          submitSection.classList.remove('hidden');
          submitBtn.disabled = !allFilled;

          var filled = fieldNames.filter(function (fn) { return values[fn] !== undefined; }).length;
          submitBtn.textContent = allFilled
            ? 'Get My Size'
            : 'Get My Size (' + filled + ' of ' + fieldNames.length + ' entered)';
        }
      }

      function submitMeasurements() {
        var measurements = {};
        fieldNames.forEach(function (fn) {
          var f = fieldData[fn];
          measurements[fn] = SizingAPI.toMetric(values[fn], f.unit, useImperial);
        });

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Calculating...';

        SizingAPI.getRecommendation(currentProduct, measurements).then(function (result) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Get My Size';

          // If disproportionate, color-code the markers
          if (result.disproportion && result.disproportion.is_disproportionate) {
            colorCodeMarkers(result);
          }

          resultSection.innerHTML = SizingAPI.renderResultCard(result) +
            '<button type="button" class="btn btn-secondary" style="width:100%;margin-top:16px;" ' +
            'id="restart-btn">Start Over</button>';

          document.getElementById('restart-btn').addEventListener('click', function () {
            values = {};
            activeField = null;
            resultSection.innerHTML = '';
            inputPanelArea.innerHTML = '';
            renderMap();
          });

          resultSection.scrollIntoView({ behavior: 'smooth' });
        }).catch(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Get My Size';
          resultSection.innerHTML = '<div class="result-card" style="border-color:red;">' +
            '<p style="color:red;">Something went wrong. Please try again.</p></div>';
        });
      }

      function colorCodeMarkers(result) {
        if (!result.disproportion || !result.disproportion.field_mappings) return;

        var recSize = result.recommended_size;
        result.disproportion.field_mappings.forEach(function (fm) {
          var items = document.querySelectorAll('.marker-item[data-field="' + fm.field + '"]');
          items.forEach(function (item) {
            if (fm.best_size === recSize) {
              item.style.borderColor = '#2e7d32';
            } else {
              item.style.borderColor = '#e65100';
              item.style.background = '#fff3e0';
            }
          });
        });
      }

      function loadProduct(productType) {
        currentProduct = productType;
        values = {};
        activeField = null;
        inputPanelArea.innerHTML = '';
        resultSection.innerHTML = '';
        mapArea.innerHTML = '<p>Loading measurements...</p>';
        submitSection.classList.add('hidden');

        SizingAPI.getProductFields(productType).then(function (data) {
          if (data.error) {
            mapArea.innerHTML = '<p style="color:red;">' + data.error + '</p>';
            return;
          }

          fieldData = data.fields;
          fieldNames = Object.keys(fieldData);
          renderMap();
        });
      }

      select.addEventListener('change', function () {
        var url = new URL(window.location);
        url.searchParams.set('product', select.value);
        window.history.replaceState({}, '', url);
        loadProduct(select.value);
      });

      submitBtn.addEventListener('click', submitMeasurements);

      loadProduct(SizingAPI.getProductFromURL());
    })();
  </script>
</body>
</html>
